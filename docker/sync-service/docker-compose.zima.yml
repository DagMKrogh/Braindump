services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: braindump
      POSTGRES_USER: ${POSTGRES_USER:-braindump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - braindump-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-braindump} -d braindump"]
      interval: 10s
      timeout: 5s
      retries: 5

  sync-service:
    image: dagmkrogh/braindump-sync:latest
    container_name: braindump-sync
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-braindump}:${POSTGRES_PASSWORD}@postgres:5432/braindump
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL:-${ALLOWED_ORIGIN}}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - braindump-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:

networks:
  braindump-net:
    driver: bridge
